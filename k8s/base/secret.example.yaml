# Example shape only – NOT listed in kustomization.yaml, never apply it.
# Create the real secret from a gitignored env file instead:
#   kubectl -n invoice-maker create secret generic invoice-api-secrets --from-env-file=k8s/secrets/prod.env
# (k8s/secrets/ is gitignored)
# Kubernetes Secrets are base64-encoded, NOT encrypted – never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: invoice-api-secrets
  namespace: invoice-maker
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster-host>/invoice_maker?retryWrites=true&w=majority"
  JWT_ACCESS_SECRET: "<generate-a-long-random-value>"
  JWT_REFRESH_SECRET: "<generate-a-different-long-random-value>"
