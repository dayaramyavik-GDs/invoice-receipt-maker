# Local Docker Desktop cluster ONLY: a MongoDB pod with persistent storage.
# Production uses MongoDB Atlas, so it needs no PVC.
# Requires: kubectl -n invoice-maker create secret generic mongo-dev-credentials \
#             --from-literal=username=devuser --from-literal=password=<choose-one>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: invoice-maker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: invoice-maker
spec:
  replicas: 1
  strategy:
    type: Recreate                 # never two Mongo pods on one volume
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-dev-credentials
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-dev-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: invoice-maker
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
