# Adds your public hostname and a Let's Encrypt certificate (via cert-manager) to the base ingress.
# SET THIS: replace api.your-domain.com with the hostname whose DNS points at your Traefik load balancer
# (no domain? use api.<your-load-balancer-IP-with-dashes>.sslip.io, e.g. api.203-0-113-10.sslip.io).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invoice-api
  namespace: invoice-maker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.your-domain.com
      secretName: invoice-api-tls
  rules:
    - host: api.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: invoice-api
                port:
                  number: 80
